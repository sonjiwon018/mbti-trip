<!DOCTYPE html>

  <meta charset="UTF-8">

  <title>MBTI로 나에게 어울리는 여행지 찾기</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
      background: #fff7df;
      color: #4f3b20;
    }

    .container {
      width: min(900px, 92%);
      margin: 0 auto;
      padding: 48px 0 60px;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 3.5rem);
      color: #8a5a18;
    }

    .subtitle {
      margin: 0 0 36px;
      font-size: 1.15rem;
      color: #735b3b;
    }

    .mbti-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      max-width: 700px;
      margin: 0 auto;
    }

    .mbti-btn {
      border: 2px solid #f0c85a;
      border-radius: 16px;
      padding: 16px 8px;
      background: #fffdf5;
      color: #684b20;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      transition: 0.15s;
    }

    .mbti-btn:hover {
      transform: translateY(-3px);
      background: #fff0b8;
    }

    .result {
      display: none;
      margin: 30px auto 0;
      max-width: 620px;
      padding: 36px 28px;
      background: #fffdf5;
      border: 3px solid #f2cf69;
      border-radius: 28px;
      box-shadow: 0 12px 30px rgba(115, 82, 25, 0.12);
    }

    .result.show {
      display: block;
    }

    .type {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      background: #ffe39a;
      color: #805516;
      font-weight: 900;
      font-size: 1rem;
    }

    .travel-emoji {
      margin: 20px 0 8px;
      font-size: 7rem;
      line-height: 1;
    }

    .place-name {
      margin: 10px 0 18px;
      font-size: clamp(2rem, 7vw, 3rem);
      color: #7c5216;
    }

    .reason {
      margin: 0 auto 24px;
      max-width: 500px;
      font-size: 1.15rem;
      line-height: 1.8;
    }

    .match {
      padding: 18px;
      border-radius: 18px;
      background: #fff3c9;
      font-size: 1.05rem;
    }

    .match strong {
      color: #9a671b;
    }

    .reset {
      margin-top: 24px;
      padding: 14px 26px;
      border: 0;
      border-radius: 14px;
      background: #e8b83f;
      color: white;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
    }

    .reset:hover {
      background: #dba82c;
    }

    @media (max-width: 600px) {
      .container {
        padding-top: 32px;
      }

      .mbti-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .result {
        padding: 28px 18px;
      }
    }
  </style>
</head>

<body>

      }

    };


    const grid = document.getElementById("mbtiGrid");

    Object.keys(data).forEach(type => {

      const button = document.createElement("button");

      button.className = "mbti-btn";
      button.textContent = type;

      button.onclick = () => showResult(type);

      grid.appendChild(button);

    });


    function showResult(type) {

      const item = data[type];

      document.getElementById("type").textContent = type;
      document.getElementById("emoji").textContent = item.emoji;
      document.getElementById("place").textContent = item.place;
      document.getElementById("reason").innerHTML = item.reason;
      document.getElementById("match").textContent = item.match;

      document.getElementById("selector").style.display = "none";
      document.getElementById("result").classList.add("show");

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }


    function resetQuiz() {

      document.getElementById("result").classList.remove("show");
      document.getElementById("selector").style.display = "block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }
